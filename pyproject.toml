[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "A small supervisor / worker / reviewer layer for scoped, gated AI-agent changes."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentgate = "agentgate.cli:main"

[tool.setuptools.packages.find]
include = ["agentgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["examples", ".agentgate"]
